name: Build news articles

on:
  push:
    branches: [main]
    paths:
      - "content/news/**"
      - "scripts/build-news.mjs"
      - ".pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-news:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Build public news pages
        run: node scripts/build-news.mjs

      - name: Save generated pages
        run: |
          if git diff --quiet; then
            echo "News pages are already current."
            exit 0
          fi

          git config user.name "Rochester Sports Foundation News Builder"
          git config user.email "actions@users.noreply.github.com"
          git add news assets/data/news.json
          git commit -m "Build public news pages"
          git push
