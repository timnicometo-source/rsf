<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | Rochester Sports Foundation</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <script src="/assets/js/main.js" defer></script>
  </head>
  <body>
    <div data-include="header"></div>
    <main>
      <section class="interior-hero">
        <div class="wrap">
          <p class="eyebrow light">Contact</p>
          <h1>Let’s move Rochester sports forward</h1>
          <p>
            Connect with the Foundation about projects, partnerships, grants,
            giving, or general questions.
          </p>
        </div>
      </section>
      <section class="section wrap">
        <div class="content-grid">
          <form class="contact-form">
            <label>Name<input name="name" /></label
            ><label>Email<input type="email" name="email" /></label
            ><label
              >Topic<select name="topic">
                <option>General question</option>
                <option>Facility project</option>
                <option>Grants</option>
                <option>Donate or partner</option>
                <option>Website feedback</option>
              </select></label
            ><label>Message<textarea name="message"></textarea></label
            ><button class="button primary" type="button">Send message</button
            ><small
              >Prototype form—delivery will be connected before launch.</small
            >
          </form>
          <aside>
            <div class="sidebar-card">
              <h3>Rochester Sports Foundation</h3>
              <p>Rochester, Minnesota</p>
              <p>
                <a
                  class="text-link"
                  href="mailto:mbehrens@rochsportsfoundation.org"
                  >mbehrens@rochsportsfoundation.org</a
                >
              </p>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <div data-include="footer"></div>
  </body>
</html>
